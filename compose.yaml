services:
  database:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_USER: wingman
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "3301:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingman -d wingman"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wingman@database:5432/wingman
    ports:
      - "3300:3000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres-data:
